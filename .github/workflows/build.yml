name: Build smusic APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: write is needed to publish the GitHub Release and to commit the
# release keystore back on the very first run.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: stable
          cache: true

      # One keystore for the life of the app so every new APK installs over the
      # previous one as an update. Created once, committed back, never deleted.
      - name: Create signing keystore (first run only, committed back)
        run: |
          if [ ! -f android/app/smusic.jks ]; then
            keytool -genkeypair -v -keystore android/app/smusic.jks \
              -storepass smusic2026 -keypass smusic2026 -alias smusic \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=smusic, OU=smusic, O=smusic, L=Ahmedabad, S=Gujarat, C=IN"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f android/app/smusic.jks
            git commit -m "chore: add release keystore [skip ci]"
            git push
          fi

      - name: Dependencies
        run: flutter pub get

      - name: Analyze (errors fail the build, warnings do not)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Read version
        id: ver
        run: |
          echo "v=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk smusic-v${{ steps.ver.outputs.v }}.apk

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: smusic-v${{ steps.ver.outputs.v }}
          path: smusic-v${{ steps.ver.outputs.v }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: smusic v${{ steps.ver.outputs.v }}
          body: |
            Install this APK on Android 8.0 or newer.
            Allow "install from unknown sources" when asked. Later versions install over this one as an update.
          files: smusic-v${{ steps.ver.outputs.v }}.apk
